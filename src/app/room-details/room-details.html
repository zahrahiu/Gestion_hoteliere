<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Dans index.html -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- Navigation Bar -->
<nav class="navbar">
  <div class="nav-container">
    <div class="logo">
      <i class="fas fa-crown"></i>
      <span>ROYELLAS <span class="hotel-name">HOTEL</span></span>
    </div>

    <ul class="nav-menu">
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          {{ item.name }}
        </a>
      </li>

    </ul>
  </div>
</nav>

<div class="back-link">
  <a [routerLink]="'/catalogue'"><i class="fas fa-arrow-left"></i> Back to Catalogue</a>
</div>

<div class="room-details">
  <!-- Image -->
  <img [src]="'http://localhost:8093/uploads/' + room.image"
       [alt]="room.type"
       class="room-img">

  <!-- Info -->
  <div class="room-info">
    <h2 class="room-number">Room {{ room.numero }}</h2>
    <h3 class="room-type"> For {{ room.type }} Guests</h3>
    <p class="room-desc">{{ room.description }}</p>
    <p class="room-price"><span>{{ room.prix }} MAD/night</span></p>
    <p class="room-bed"><i class="fas fa-bed"></i> Bed: {{ room.lit_long }}x{{ room.lit_large }}</p>

    <!-- Status badge -->
    <p class="room-status-msg"
       [ngClass]="{
         'occupied-msg': room.etat === 'Occupée',
         'maintenance-msg': room.etat === 'Maintenance',
         'available-msg': room.etat === 'Disponible'
       }">
      {{ room.etat }}
    </p>

    <!-- Reserve button -->
    <button
      class="reserve-btn"
      [disabled]="room.etat !== 'Disponible'">
      Reserve a Room
    </button>
  </div>
</div>
